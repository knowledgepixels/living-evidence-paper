<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 272" width="592" height="272" role="img" aria-labelledby="title desc">
  <title id="title">The closed bench–graph loop</title>
  <desc id="desc">A cycle of six boxes. Top row, left to right: wet lab (Xenopus pair, calcium imaging, injury); microscopy TIFF stacks; quantification (sparks to clusters to regions). An arrow leads down to evidence plus SPC nanopublication (weight of evidence), then left to the Project Delphi evidence graph, then left to hypothesis prioritization (what to test next), and back up to the wet lab.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2e8555"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Latin Modern Roman", "Computer Modern Serif", "Times New Roman", Times, serif; font-size: 16px; fill: #111; text-anchor: middle; }
    .it { font-style: italic; }
    .sup { font-size: 11px; }
    .box { stroke-width: 1.4; }
    .blue { fill: #edf2f9; stroke: #2f5f8f; }
    .green { fill: #ebf6ef; stroke: #2e8555; }
    .orange { fill: #fbefe7; stroke: #c95f1a; }
    .flow { stroke: #444; stroke-width: 1.4; fill: none; }
    .back { stroke: #2e8555; stroke-width: 1.4; fill: none; }
  </style>

  <!-- Baked-in white panel so the figure stays readable on a dark page. -->
  <rect width="592" height="272" fill="#fff"/>

  <!-- Columns: x = 20, 216, 412 (width 160). Top row centre y = 62. -->
  <rect class="box green" x="20" y="22" width="160" height="80" rx="6"/>
  <text x="100" y="48">Wet lab</text>
  <text x="100" y="68"><tspan class="it">Xenopus</tspan> pair,</text>
  <text x="100" y="88">Ca<tspan class="sup" dy="-6">2+</tspan> <tspan dy="6">imaging, injury</tspan></text>

  <rect class="box blue" x="216" y="32" width="160" height="60" rx="6"/>
  <text x="296" y="58">Microscopy</text>
  <text x="296" y="78">TIFF stacks</text>

  <rect class="box blue" x="412" y="22" width="160" height="80" rx="6"/>
  <text x="492" y="48">Quantification</text>
  <text x="492" y="68">sparks → clusters</text>
  <text x="492" y="88">→ regions</text>

  <!-- Bottom row centre y = 210 -->
  <rect class="box green" x="20" y="170" width="160" height="80" rx="6"/>
  <text x="100" y="196">Hypothesis</text>
  <text x="100" y="216">prioritization</text>
  <text x="100" y="236">(what to test next)</text>

  <rect class="box orange" x="216" y="180" width="160" height="60" rx="6"/>
  <text x="296" y="206">Project Delphi</text>
  <text x="296" y="226">evidence graph</text>

  <rect class="box orange" x="412" y="170" width="160" height="80" rx="6"/>
  <text x="492" y="196">Evidence + SPC</text>
  <text x="492" y="216">nanopublication</text>
  <text x="492" y="236">(weight of evidence)</text>

  <!-- Arrows around the loop -->
  <path class="flow" d="M180,62 H214" marker-end="url(#arrow)"/>
  <path class="flow" d="M376,62 H410" marker-end="url(#arrow)"/>
  <path class="flow" d="M492,102 V168" marker-end="url(#arrow)"/>
  <path class="flow" d="M412,210 H378" marker-end="url(#arrow)"/>
  <path class="flow" d="M216,210 H182" marker-end="url(#arrow)"/>
  <path class="back" d="M100,170 V104" marker-end="url(#arrow-green)"/>
</svg>
